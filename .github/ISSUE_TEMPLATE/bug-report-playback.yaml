name: Media playback bug report
description: Report a playback bug in Velella (video, audio, subtitles, HDR, refresh rate)
labels:
  - bug
  - playback
body:
  - type: checkboxes
    id: before-posting
    attributes:
      label: "This issue respects the following points:"
      description: All conditions are **required**.
      options:
        - label: This issue is **not** already reported on [GitHub](https://github.com/miracle091/velella/issues?q=is%3Aissue) _(I've searched it)_.
          required: true
        - label: The bug happens in the latest [Velella release](https://github.com/miracle091/velella/releases/latest).
          required: true
        - label: This report addresses only a single issue; if you encounter multiple issues, create separate reports for each one.
          required: true
  - type: markdown
    attributes:
      value: |
        Velella is a fork of Jellyfin for Android TV. Report bugs in Velella here, not to the Jellyfin project.
        ## Bug information
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: |
        A clear description of the bug, with the steps to reproduce it and what you expected instead.
        Say whether the file plays directly or is transcoded (the play method in the player's top panel).
      placeholder: |
        1. Play …
        2. Press …
        3. See error / the picture stutters

        Instead, I expect …
    validations:
      required: true
  - type: textarea
    id: mediainfo
    attributes:
      label: Media info of the file
      description: |
        The media information of the file, from `ffprobe ./file.mkv` or from the web interface (Media info).
      placeholder: Paste media info…
      render: shell
  - type: textarea
    id: mediacapabilitiesreport
    attributes:
      label: Media capabilities report
      description: |
        The playback capabilities report, generated by the app:
        1. Connect Velella to a server **that you have admin access to**
        2. Go to Settings → Playback → Advanced playback preferences
        3. Select "Report playback capabilities to server"
        4. In the server dashboard, open "Logs" and download the newest file whose name starts with `upload_`
      placeholder: Paste capability report contents…
  - type: markdown
    attributes:
      value: |
        ## Logs
  - type: textarea
    id: logs
    attributes:
      label: Client logs
      description: |
        Crash logs from the server dashboard (with "Send crash reports to server" on), or `adb logcat -d` taken right
        after the problem. Remove anything sensitive, such as the server URL, access tokens or passwords.
      placeholder: Paste logs…
      render: shell
  - type: textarea
    id: logs-ffmpeg
    attributes:
      label: FFmpeg logs
      description: For transcoded playback, the FFmpeg log from the server dashboard under "Logs".
      placeholder: Paste logs…
      render: shell
  - type: markdown
    attributes:
      value: |
        ## Environment
  - type: input
    id: app-version
    attributes:
      label: Velella version
      description: Shown in Settings → About.
      placeholder: 0.5.0
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - NVIDIA Shield TV (2015)
        - NVIDIA Shield TV Pro (2017)
        - NVIDIA Shield TV (2019, tube)
        - NVIDIA Shield TV Pro (2019)
        - Other Android TV device
    validations:
      required: true
  - type: input
    id: system-version
    attributes:
      label: System version
      description: Shield Experience version, or the ROM and its version for AOSP or LineageOS builds.
      placeholder: Shield Experience 9.2.1, LineageOS 21
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: TV or receiver
      description: Model of the TV, and of the AV receiver or soundbar if the signal goes through one.
      placeholder: LG C2, Denon AVR-X2800H
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Jellyfin server version
      description: If on unstable, specify the commit hash.
      placeholder: 10.11.0
    validations:
      required: true
