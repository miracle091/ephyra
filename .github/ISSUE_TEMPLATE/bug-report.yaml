name: Bug report
description: Report a bug in Velella
labels:
  - bug
body:
  - type: checkboxes
    id: before-posting
    attributes:
      label: "This issue respects the following points:"
      description: All conditions are **required**.
      options:
        - label: This issue is **not** already reported on [GitHub](https://github.com/miracle091/velella/issues?q=is%3Aissue) _(I've searched it)_.
          required: true
        - label: The bug happens in the latest [Velella release](https://github.com/miracle091/velella/releases/latest).
          required: true
        - label: This report addresses only a single issue; if you encounter multiple issues, create separate reports for each one.
          required: true
  - type: markdown
    attributes:
      value: |
        Velella is a fork of Jellyfin for Android TV. Report bugs in Velella here, not to the Jellyfin project.
        ## Bug information
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: |
        A clear description of the bug, with the steps to reproduce it and what you expected instead.
        You can also attach screenshots or screen recordings.
      placeholder: |
        1. Go to …
        2. Press …
        3. See error / the app crashes

        Instead, I expect …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        With "Send crash reports to server" on (Settings → Crash reporting), crash logs appear in the server dashboard
        under "Logs", in the newest file whose name starts with `upload_`. You can also use `adb logcat -d`.
        Remove anything sensitive, such as the server URL, access tokens or passwords.
      placeholder: Paste logs…
      render: shell
  - type: markdown
    attributes:
      value: |
        ## Environment
  - type: input
    id: app-version
    attributes:
      label: Velella version
      description: Shown in Settings → About.
      placeholder: 0.5.0
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - NVIDIA Shield TV (2015)
        - NVIDIA Shield TV Pro (2017)
        - NVIDIA Shield TV (2019, tube)
        - NVIDIA Shield TV Pro (2019)
        - Other Android TV device
    validations:
      required: true
  - type: input
    id: system-version
    attributes:
      label: System version
      description: Shield Experience version, or the ROM and its version for AOSP or LineageOS builds.
      placeholder: Shield Experience 9.2.1, LineageOS 21
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Jellyfin server version
      description: If on unstable, specify the commit hash.
      placeholder: 10.11.0
    validations:
      required: true
