name: Feature request
description: Request a new feature for Velella
labels:
  - enhancement
body:
  - type: checkboxes
    id: before-posting
    attributes:
      label: "This request respects the following points:"
      description: All conditions are **required**.
      options:
        - label: This request is **not** already on [GitHub](https://github.com/miracle091/velella/issues?q=is%3Aissue+label%3Aenhancement) _(I've searched it)_.
          required: true
        - label: The feature works without Google Play Services, as Velella also runs on GMS-free builds.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: Describe the problem you have or the gap you want to fill.
      placeholder: |
        The app does not show lyrics, while the Jellyfin web interface does.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to see implemented or changed.
      placeholder: |
        The app could show lyrics on the page that opens when music plays.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have thought about.
      placeholder: |
        A "Lyrics" button in the player that opens a full-screen lyrics view.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Any details, links or screenshots that help to understand the request.
      placeholder: Add any additional context here.
    validations:
      required: false
